<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tastir: draw Islamic geometric patterns</title>
    <meta
      name="description"
      content="Draw Islamic geometric patterns with a compass and a ruler, one step at a time, then repeat and color them, checked against photos of real walls."
    />
    <meta name="theme-color" content="#f4ede1" />
    <script>
      // Light or dark before the first paint: the learner's choice, else the
      // device's setting (see src/app/theme.tsx).
      try {
        var saved = JSON.parse(localStorage.getItem('tastir.theme') || 'null');
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Marcellus&family=Reem+Kufi:wght@400;500;600;700&display=swap"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
